services:
  app:
    build: .
    container_name: ebi-resources-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://ebiresources.com
      DATABASE_URL: postgresql://ebi:ebi@127.0.0.1:5432/ebi?schema=public