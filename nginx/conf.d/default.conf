# =============================================================================
# EBI Resources - Nginx reverse proxy
# Proxies public traffic to the Next.js app container (service "app":3000).
# The site sits behind Cloudflare, so Cloudflare handles the public TLS edge.
# =============================================================================

# Map for websocket / HMR upgrade handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream Next.js app (compose service name "app").
upstream ebi_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # Replace with the real domain in production, e.g. ebiresources.co.id
    server_name _;

    # Allow reasonably large uploads (e.g. resume/CV files on Careers page).
    client_max_body_size 10m;

    # ---- gzip compression --------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---- reverse proxy to Next.js -----------------------------------------
    location / {
        proxy_pass http://ebi_app;
        proxy_http_version 1.1;

        # Standard proxy headers.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Websocket / Next.js HMR support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_cache_bypass  $http_upgrade;
    }

    # Optional: serve Next.js static assets with long-lived caching.
    location /_next/static/ {
        proxy_pass http://ebi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# =============================================================================
# HTTPS / TLS notes
# -----------------------------------------------------------------------------
# This deployment is fronted by Cloudflare, so there are two common options:
#
#   1) Cloudflare "Flexible" (Cloudflare <-> origin over HTTP:80): keep the
#      block above as-is. Cloudflare terminates TLS at its edge.
#
#   2) Cloudflare "Full (strict)" (recommended): terminate TLS here too using a
#      Cloudflare Origin Certificate. Mount certs (see docker-compose.yml,
#      the nginx `certs` volume + publish port 443), then enable the block
#      below and redirect HTTP -> HTTPS.
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name ebiresources.co.id;
#
#     ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
#     ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
#     client_max_body_size 10m;
#     # ... same location / block as above ...
# }
#
# # Redirect all HTTP to HTTPS (enable together with the 443 block):
# # server {
# #     listen 80;
# #     server_name ebiresources.co.id;
# #     return 301 https://$host$request_uri;
# # }
#
# -----------------------------------------------------------------------------
# Restoring the real visitor IP behind Cloudflare
# -----------------------------------------------------------------------------
# When behind Cloudflare, $remote_addr is a Cloudflare IP. To log/forward the
# real client IP, trust Cloudflare ranges and use the CF-Connecting-IP header.
# Keep the ranges updated from https://www.cloudflare.com/ips/ .
#
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
