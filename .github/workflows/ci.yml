name: CI

# Continuous Integration untuk EBI Resources (Next.js App Router + Prisma).
# Lint & build pada setiap push/PR ke main. Push ke main yang hijau
# otomatis deploy ke VPS (tidak perlu SSH manual).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama pada ref/branch yang sama agar hemat resource CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    # Env dummy agar `prisma generate` & `next build` tidak gagal di CI.
    # Nilai ini hanya placeholder untuk keperluan build (tidak konek DB sungguhan).
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/ebi_resources?schema=public"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
