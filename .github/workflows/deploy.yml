name: Deploy to VPS

# Deploy EBI Resources ke VPS Hostinger (Ubuntu) via SSH.
#
# Kapan deploy jalan:
# - Push ke `main` yang CI-nya hijau (dipanggil dari ci.yml — tidak perlu SSH ke VPS)
# - Push tag rilis `v*`
# - Manual (Actions → Deploy to VPS → Run workflow)
# Jika secrets belum diisi, step SSH gagal dengan error jelas.
#
# GITHUB SECRETS YANG WAJIB DIISI (Settings > Secrets and variables > Actions):
#   - VPS_HOST     : IP / hostname VPS Hostinger (mis. 123.45.67.89)
#   - VPS_USER     : user SSH di VPS (mis. deploy / root)
#   - VPS_SSH_KEY  : private key SSH (isi lengkap, format PEM/OpenSSH) untuk login ke VPS
#   - VPS_APP_DIR  : path absolut direktori aplikasi di VPS (mis. /home/deploy/ebi-resources)
# OPSIONAL:
#   - VPS_PORT     : port SSH (default 22 bila tidak diisi)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

# Cegah dua deploy berjalan bersamaan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"

            # Ambil kode terbaru dari repository.
            git pull --ff-only

            # Production VPS uses docker-compose.prod.yml (app on 127.0.0.1:3005).
            # Do not use the default compose file — that stack also starts nginx:80.
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

            # Schema is optional for the current static site; don't fail the release.
            docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy || true

            docker image prune -f
